[tool]
id = "com.lightphone.chats"
label = "Chats"
versionCode = 60
versionName = "0.8.1"
permissions = ["android.permission.INTERNET", "android.permission.POST_NOTIFICATIONS"]
# Single-APK build (2026-08-19): the former :server companion is a library
# merged into this APK, which hosts its own LightSdkService + the persistent
# Matrix connection (sync loop, storage, notifications) and binds to itself —
# serverPackage is the tool's own id, so no separate companion APK to install
# and no dependency on Light shipping chat methods in com.lightos.
serverPackage = "com.lightphone.chats"
orientation = "portrait"
